[package]
name = "yuki"
version = "0.1.0"
edition = "2021"
authors = ["Yuki Project"]
description = "Yuki Personal AI Platform — MVP-1"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
zeroize = { version = "1.8", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1.1.10"
brotli = "9.0.0"




[[bin]]
name = "yuki"
path = "src/main.rs"

[lib]
name = "yuki"
path = "src/lib.rs"
